name: Terraform security validation

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform format and validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  security:
    name: Checkov security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        run: |
          python3 -m venv .venv-checkov
          .venv-checkov/bin/python -m pip install --upgrade pip
          .venv-checkov/bin/pip install checkov==3.4.0

      - name: Scan Terraform with Checkov
        run: .venv-checkov/bin/checkov --directory . --framework terraform --output cli
